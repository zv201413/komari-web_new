  version: "v1.3.0"
  description: "Komari Web 监控前端，支持多语言、动态 CPU 核心数显示以及响应式卡片布局"
  tech_stack: ["React", "TypeScript", "Vite", "i18next"]

public_docs:
  features: ["动态展示 CPU 核心数标签", "中英繁日多语言国际化支持", "响应式服务器节点卡片展示"]
