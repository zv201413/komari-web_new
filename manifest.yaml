private_knowledge:
  dev_logs:
    - date: "2026-05-19"
      type: "patch"
      title: "优化 CPU 核心数动态显示并适配 float64"
      issue: "CPU 进度条只显示 CPU 字段，看不到服务器是几核；在 float64 核心数（如 0.5核）情况下无法正确展示"
      solution: "修改 Node.tsx 标签逻辑，提取 basic.cpu_cores；整数直接显示 N核，小数调用 toFixed(1) 展示为小数核数；新增中、英、日、繁体 cores 翻译键"
  env_mapping: []
  architecture: ["Vite", "React", "TypeScript"]

